<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> PROJECT </title>
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet"/>
<style>
body {    
    background: #08020f;    
}
#F {
    width: 100%;
    height: 57vh;
    scroll: none;
    border: .1px solid #08020f;
    margin-top: -2vh;
    border-radius: 20px;
    background: url(https://da.gd/Z4fBU7);
    background-size: 50vh 60vh; 
    background-repeat: no-repeat;
    background-position: center;
}
#Lista {
    gap: 15px;
    height: 30vh;
    padding: 10px;  
    display: grid;
    overflow: auto;
    list-style: none;        
    grid-template-columns: repeat(3, 1fr);
    font-family: 'Luckiest Guy', cursive;
    -webkit-text-stroke: .1px #003;
    text-shadow: 0px .1px 0 #001;
}
#Lista li {
    position: relative;
    width: 100%;
    height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    box-sizing: border-box;
    border-radius: 16px;
    
    /* Fondo con degradado elegante de plataforma streaming */
    background: linear-gradient(145deg, #0a0f1d, #02050b);
    border: 1px solid rgba(0, 240, 255, 0.25);
    box-shadow: 0 6px 15px rgba(0, 0, 0, 0.7);
    overflow: hidden;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
}

/* Línea superior neón tipo "Póster VIP" */
#Lista li::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 3px;
    background: linear-gradient(90deg, #00f0ff, #7f05ff, #ff007f);
}

/* Marca de agua flotante de Play (▶) en el fondo de la tarjeta */
#Lista li::after {
    content: '▶';
    position: absolute;
    font-size: 45px;
    color: rgba(255, 255, 255, 0.04);
    bottom: -5px;
    right: 5px;
    pointer-events: none;
    transition: color 0.3s ease;
}

/* Texto del título ajustado y centrado */
#Lista li a {
    color: #4f7;
    cursor: none;
    font-size: 13px;
    line-height: 1.3;
    text-align: center;
    text-decoration: none;
    word-break: break-word;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
    z-index: 1;
}
#Lista li:hover {
    transform: translateY(-5px) scale(1.03);
    border-color: #00f0ff;
    background: linear-gradient(145deg, #121c33, #080e1a);
    box-shadow: 0 10px 25px rgba(0, 240, 255, 0.35);
}

#Lista li:hover::after {
    color: rgba(0, 240, 255, 0.15);
}
#Lista li:hover a {
    color: #7F05FF;
}
</style>
</head>
<body>
<center>
    <iframe id="F" src="" frameborder="1" allowfullscreen="true" allow="encrypted-media" allow="autoplay" scrolling="no"></iframe>    
      
       <ul id="Lista"></ul>
              
</center>
<script>
 var CH = [
  {name: "🧋 La Movie Tv", url: "https://la-movie-tv-copy-6bcea7e4.base44.app"}, 
  {name: "🧋 FUTURAMA TV", url: "https://cine-loop-247-copy-7efb5cf0.base44.app/"}
 ];

 CH.forEach(canal => {
    let li = document.createElement('li');
    li.innerHTML = `<a class="DATA" href="${canal.url}">${canal.name}</a>`;
    Lista.appendChild(li);  
 });


    var LIST = document.querySelectorAll('#Lista li');
    
 LIST.forEach(lis => {
   lis.onclick = (e) => {    
     e.preventDefault();  
       LIST.forEach(other => {
   other.style.border = '';
  other.style.color = '#4f7'; 
  other.style.background = '#001';
      });
 var Enlace = e.target.href;
     lis.style.color = '#7F05FF';
  lis.style.background = '#000';
lis.style.borderTop = '1px solid #4f3';
lis.style.borderBottom = '.1px solid #4f3';
   
      if (lis.textContent.includes('FUTURAMA')) {
    F.style.transform = "translate(0vh, -11vh)";
    F.style.height = "70vh";
    F.style.marginBottom = '-11vh';
    document.body.style.background = '#000016';   
             } else {
       F.style.width = "100%";
       F.style.height = "57vh";
       F.style.marginBottom = '0vh';
       F.style.transform = "none";
     document.body.style.background = '#08020f';
   }
           F.src = Enlace;
    }
 })
</script>
</body>
</html>
